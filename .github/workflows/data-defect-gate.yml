name: Data-defect Gate 1

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-gate-one:
    name: Verify current proposal approval
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check linked data-defect approval
        uses: actions/github-script@v7
        with:
          script: |
            const { verifyGateOne } = require("./.github/scripts/data-defect-gate.js");
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const linkedIssues = [...body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map((match) => Number(match[1]));
            const isDataDefectPR = pr.labels.some((label) => label.name === "data-defect") ||
              /^\[data defect\]/i.test(pr.title);

            if (linkedIssues.length === 0) {
              if (isDataDefectPR) {
                core.setFailed("A data-defect pull request must use a closing reference such as `Closes #123`.");
              } else {
                core.info("No linked data-defect issue; Gate 1 check is not applicable.");
              }
              return;
            }

            const issues = await Promise.all(linkedIssues.map(async (issue_number) => {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number
              });
              return data;
            }));
            const defect = issues.find((issue) =>
              issue.labels.some((label) => label.name === "data-defect")
            );

            if (!defect) {
              core.info("No linked data-defect issue; Gate 1 check is not applicable.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: defect.number,
              per_page: 100
            });
            const approval = await verifyGateOne({
              issue: defect,
              comments,
              github,
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info(`Gate 1 approval by @${approval.owner} is bound to proposal revision ${approval.sha}.`);
