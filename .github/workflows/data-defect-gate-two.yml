name: Data-defect Gate 2

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-evidence:
    name: Verify Data-defect Gate 2 evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request validators with read-only permissions
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate evidence against the current commit
        uses: actions/github-script@v7
        with:
          script: |
            const { findLinkedIssueNumbers, isDataDefect } =
              require("./.github/scripts/data-defect-gate.js");
            const { validateGateTwoEvidence } =
              require("./.github/scripts/gate-two-evidence.js");

            const pr = context.payload.pull_request;
            let applies = pr.labels.some((label) => label.name === "data-defect") ||
              /^\[data defect\]/i.test(pr.title);

            if (!applies) {
              const issueNumbers = findLinkedIssueNumbers(pr.body || "");
              for (const issue_number of issueNumbers) {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number
                });
                if (isDataDefect(issue)) {
                  applies = true;
                  break;
                }
              }
            }

            try {
              const result = validateGateTwoEvidence({
                body: pr.body || "",
                headSha: pr.head.sha,
                isDataDefect: applies
              });
              core.info(result.applicable
                ? "Data-defect Gate 2 evidence is complete and bound to the current PR commit."
                : "No linked data-defect; Gate 2 evidence is not applicable.");
            } catch (error) {
              core.setFailed(error.message);
            }
