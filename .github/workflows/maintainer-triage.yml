name: Enforce maintainer-only agent triage

on:
  issues:
    types:
      - labeled

permissions:
  administration: read
  issues: write

jobs:
  verify-maintainer:
    if: github.event.label.name == 'agent-triage'
    runs-on: ubuntu-latest
    steps:
      - name: Require maintain permission for agent triage
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.sender.login;
            let permission = "none";

            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: actor
              });
              permission = data.permission;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (permission === "admin" || permission === "maintain") {
              core.info(`Agent triage label applied by authorized ${permission} user.`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: "agent-triage"
            });
            core.setFailed(`Removed agent-triage label: ${actor} has ${permission} permission; admin or maintain is required.`);
